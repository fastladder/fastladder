name: Test

on: push

env:
  RAILS_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ImageMagick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download --repo ImageMagick/ImageMagick --pattern 'ImageMagick-*x86_64.AppImage' --output magick.AppImage
          chmod +x magick.AppImage
          # Extract instead of mounting so libfuse2 is not needed.
          ./magick.AppImage --appimage-extract > /dev/null
          mkdir -p bin
          ln -s "$RUNNER_TEMP/squashfs-root/AppRun" bin/magick
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: magick -version
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: cp config/database.yml.sqlite3 config/database.yml
      - run: bundle exec rake db:create db:migrate setup
      - run: ./bin/rails test
      - uses: browser-actions/setup-chrome@v2
      - run: xvfb-run ./bin/rails test:system
